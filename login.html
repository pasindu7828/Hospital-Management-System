<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Hospital Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="fas fa-hospital-alt fa-3x text-primary mb-3"></i>
              <h3 class="card-title">Welcome Back</h3>
              <p class="text-muted">Sign in to access your Hospital Management System</p>
            </div>
            <form id="loginForm">
              <div class="mb-4">
                <label for="loginUsername" class="form-label">
                  <i class="fas fa-user me-2"></i>Username
                </label>
                <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required>
              </div>
              <div class="mb-4">
                <label for="loginPassword" class="form-label">
                  <i class="fas fa-lock me-2"></i>Password
                </label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
              </button>
            </form>
            <div class="text-center">
              <span class="text-muted">Don't have an account? 
                <a href="signup.html" class="text-decoration-none">
                  <i class="fas fa-user-plus me-1"></i>Sign up
                </a>
              </span>
            </div>
            <div id="loginAlert" class="alert alert-danger mt-4 d-none" role="alert">
              <i class="fas fa-exclamation-triangle me-2"></i>
              <span id="loginAlertText"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
