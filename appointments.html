<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments - Hospital Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">HospitalMS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link active" href="appointments.html">Appointments</a></li>
          <li class="nav-item">
            <button id="logoutBtn" class="btn btn-outline-light ms-3 d-none">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2>Appointments</h2>
    <!-- Add Appointment Form -->
    <form id="appointmentForm" class="row g-3 mb-4">
      <div class="col-md-4">
        <input type="text" class="form-control" id="appointmentPatient" placeholder="Patient Name" required>
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="appointmentDoctor" placeholder="Doctor Name" required>
      </div>
      <div class="col-md-4">
        <input type="datetime-local" class="form-control" id="appointmentDate" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Add Appointment</button>
      </div>
    </form>
    <!-- Appointments Table -->
    <table class="table table-bordered" id="appointmentsTable">
      <thead class="table-light">
        <tr>
          <th>Patient</th>
          <th>Doctor</th>
          <th>Date & Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Appointment rows will go here -->
      </tbody>
    </table>

    <!-- Edit Appointment Modal -->
    <div class="modal fade" id="editAppointmentModal" tabindex="-1" aria-labelledby="editAppointmentModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editAppointmentModalLabel">Edit Appointment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editAppointmentForm">
              <div class="mb-3">
                <label for="editAppointmentPatient" class="form-label">Patient</label>
                <input type="text" class="form-control" id="editAppointmentPatient" required>
              </div>
              <div class="mb-3">
                <label for="editAppointmentDoctor" class="form-label">Doctor</label>
                <input type="text" class="form-control" id="editAppointmentDoctor" required>
              </div>
              <div class="mb-3">
                <label for="editAppointmentDate" class="form-label">Date & Time</label>
                <input type="datetime-local" class="form-control" id="editAppointmentDate" required>
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (localStorage.getItem('isLoggedIn') === 'true') {
      document.getElementById('logoutBtn').classList.remove('d-none');
    }
  </script>
</body>
</html>
