<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patients - Hospital Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">HospitalMS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="patients.html">Patients</a></li>
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="appointments.html">Appointments</a></li>
          <li class="nav-item">
            <button id="logoutBtn" class="btn btn-outline-light ms-3 d-none">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2>Patients</h2>
    <!-- Add Patient Form -->
    <form id="patientForm" class="row g-3 mb-4">
      <div class="col-md-4">
        <input type="text" class="form-control" id="patientName" placeholder="Patient Name" required>
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control" id="patientAge" placeholder="Age" required>
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="patientDisease" placeholder="Disease" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Add Patient</button>
      </div>
    </form>
    <!-- Patients Table -->
    <table class="table table-bordered" id="patientsTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Disease</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Patient rows will go here -->
      </tbody>
    </table>

    <!-- Edit Patient Modal -->
    <div class="modal fade" id="editPatientModal" tabindex="-1" aria-labelledby="editPatientModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editPatientModalLabel">Edit Patient</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editPatientForm">
              <div class="mb-3">
                <label for="editPatientName" class="form-label">Name</label>
                <input type="text" class="form-control" id="editPatientName" required>
              </div>
              <div class="mb-3">
                <label for="editPatientAge" class="form-label">Age</label>
                <input type="number" class="form-control" id="editPatientAge" required>
              </div>
              <div class="mb-3">
                <label for="editPatientDisease" class="form-label">Disease</label>
                <input type="text" class="form-control" id="editPatientDisease" required>
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/patients.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (localStorage.getItem('isLoggedIn') === 'true') {
      document.getElementById('logoutBtn').classList.remove('d-none');
    }
  </script>
</body>
</html>
