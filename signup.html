<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Hospital Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="signup-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="fas fa-hospital-alt fa-3x text-primary mb-3"></i>
              <h3 class="card-title">Create Account</h3>
              <p class="text-muted">Join our Hospital Management System</p>
            </div>
            <form id="signupForm">
              <div class="mb-4">
                <label for="signupUsername" class="form-label">
                  <i class="fas fa-user me-2"></i>Username
                </label>
                <input type="text" class="form-control" id="signupUsername" placeholder="Choose a username" required>
              </div>
              <div class="mb-4">
                <label for="signupPassword" class="form-label">
                  <i class="fas fa-lock me-2"></i>Password
                </label>
                <input type="password" class="form-control" id="signupPassword" placeholder="Create a password" required>
              </div>
              <div class="mb-4">
                <label for="signupConfirmPassword" class="form-label">
                  <i class="fas fa-lock me-2"></i>Confirm Password
                </label>
                <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Confirm your password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fas fa-user-plus me-2"></i>Create Account
              </button>
            </form>
            <div class="text-center">
              <span class="text-muted">Already have an account? 
                <a href="login.html" class="text-decoration-none">
                  <i class="fas fa-sign-in-alt me-1"></i>Login
                </a>
              </span>
            </div>
            <div id="signupAlert" class="alert alert-danger mt-4 d-none" role="alert">
              <i class="fas fa-exclamation-triangle me-2"></i>
              <span id="signupAlertText"></span>
            </div>
            <div id="signupSuccess" class="alert alert-success mt-4 d-none" role="alert">
              <i class="fas fa-check-circle me-2"></i>
              <span id="signupSuccessText"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
